[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toxicity-criterion"
version = "1.0.0"
description = "Contagion-based method-selection criterion , reproducibility code for 'Testing for Toxicity Contagion Before Applying Network Amplifier-Ranking Methods: A UK Reddit Case Study' (IEEE ICDM 2026, Applied Track)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Fatemeh Akrami" },
    { name = "Alexandru Ilies" },
    { name = "Alberto Garcia-Robledo" },
    { name = "Mahboobeh Zangiabady" },
]

# Core dependencies to reproduce the paper's tables and figures (CPU only).
dependencies = [
    "networkx==3.6.1",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "matplotlib==3.10.9",
]

[project.optional-dependencies]
# Stage 2 / Stage 3 labelling + 3-LLM silver panel (API-only; needs keys in .env).
# `requests` also powers scraping + rehydration of the dehydrated corpus.
labelling = ["anthropic>=0.105", "openai>=2.4", "google-genai>=2.8", "requests>=2.31"]
# Stage 2 GPT-OSS 20B LoRA fine-tune (stratifier only; needs a GPU) + adapter upload.
finetune = ["torch", "transformers", "peft", "trl", "datasets", "huggingface_hub>=0.24"]
# Development: linting, formatting, tests.
dev = ["ruff>=0.6", "black>=24.0", "pytest>=8.0"]

[project.scripts]
criterion-run = "toxicity_criterion.cli:criterion_run"
reproduce-all = "toxicity_criterion.cli:reproduce_all"
make-figures = "toxicity_criterion.cli:make_figures"

[tool.setuptools]
packages = [
    "toxicity_criterion",
    "toxicity_criterion.criterion",
    "toxicity_criterion.validation",
    "toxicity_criterion.robustness",
    "toxicity_criterion.figures",
    "toxicity_criterion.labelling",
    "toxicity_criterion.scraping",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E741",  # ambiguous variable names (l, I) appear in the math-heavy modules
    "E501",  # line length is managed by black; long strings/comments are left intact
    "B905",  # zip(..., strict=) not required for these equal-length sequences
]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
